name: Build and publish showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this main-branch build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: '0.166.0'
      HUGO_SHA256: '0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Hugo extended
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive_path" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build and check production site
        shell: bash
        run: |
          set -euo pipefail
          hugo version
          hugo --environment production --cacheDir "$RUNNER_TEMP/hugo-cache" \
            --noBuildLock --panicOnWarning --printPathWarnings --printI18nWarnings
          python3 tests/check_pages.py public
          python3 tests/check_workflow.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # needs: build requires success; PRs and non-main runs cannot publish.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
