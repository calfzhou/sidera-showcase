baseURL = 'https://example.org/'
title = 'Fieldbook'
theme = 'sidera'
locale = 'en-US'
timeZone = 'Asia/Shanghai'
disableKinds = ['RSS']
[taxonomies]
_merge = 'shallow'
[permalinks.term]
_merge = 'shallow'
[frontmatter]
date = ['date', 'publishDate', 'pubdate', 'published']
publishDate = ['publishDate', 'pubdate', 'published', 'date']
lastmod = ['lastmod', 'modified', 'publishDate', 'pubdate', 'published', 'date']
[permalinks.page]
journal = '/journal/:year/:month/:day/:slugorcontentbasename/'
[pagination]
path = 'page'
disableAliases = true
[params]
# Theme default is auto; this demo deliberately starts new visitors in dark mode.
color_mode = 'dark'
left = ['menu', 'welcome']
footer_menu = 'footer'
footer_text = 'A small, independent notebook. Written to be revisited.'
[params.identity]
image = 'images/sidera-mark.svg'
subtitle = 'Notes & everyday tools | Small ideas, kept close'
[params.profile]
title = 'A working notebook'
text = 'Observations from the desk and the field. Small ideas, kept in one place.'
[cascade.params]
article_text = 'Have a different approach? [Get in touch](mailto:hello@example.org).'
[[menus.primary]]
name = 'Overview'
pageRef = '/'
weight = 1
[menus.primary.params]
icon = 'home'
[[menus.primary]]
name = 'Notes'
pageRef = '/notes'
weight = 2
[menus.primary.params]
icon = 'notebook'
color = '#3dc550'
[[menus.primary]]
name = 'Journal'
pageRef = '/journal'
weight = 3
[menus.primary.params]
icon = 'blog'
color = '#ffbd2b'
[[menus.primary]]
name = 'Handbook'
pageRef = '/handbook'
weight = 4
[menus.primary.params]
icon = 'docs'
[[menus.primary]]
name = 'About'
pageRef = '/about'
weight = 5
[menus.primary.params]
icon = 'star'
[[menus.footer]]
identifier = 'fieldbook'
name = 'Fieldbook'
weight = 1
[[menus.footer]]
name = 'About'
pageRef = '/about'
parent = 'fieldbook'
[[menus.footer]]
identifier = 'reading'
name = 'Reading'
weight = 2
[[menus.footer]]
name = 'Notes'
pageRef = '/notes'
parent = 'reading'
[[menus.footer]]
name = 'Journal'
pageRef = '/journal'
parent = 'reading'
[[menus.footer]]
identifier = 'explore'
name = 'Explore'
weight = 3
[[menus.footer]]
name = 'Topics'
pageRef = '/tags'
parent = 'explore'
[[menus.footer]]
name = 'Handbook'
pageRef = '/handbook'
parent = 'explore'


# Define once, reference by name from any compatible region.
[params.widgets.welcome]
component = 'text'
[params.widgets.welcome.config]
title = 'Welcome'
text = """
Notes, experiments, and useful things to return to.

Explore the journal, notes, and handbook.
"""

[params.widgets.handbook-updates]
component = 'recent'
[params.widgets.handbook-updates.config]
order = 'modification'
count = 8


# Social images are site-owned local assets, not a required theme icon framework.
[[menus.social]]
name = 'Email'
url = 'mailto:hello@example.org'
weight = 10
[menus.social.params]
image = 'icons/email.svg'
[[menus.social]]
name = 'Code'
url = 'https://github.com/'
weight = 20
[menus.social.params]
image = 'icons/code.svg'
[[menus.social]]
name = 'Color mode'
weight = 30
[menus.social.params]
icon = 'color-mode'
onclick = 'Sidera.cycleColorMode()'
