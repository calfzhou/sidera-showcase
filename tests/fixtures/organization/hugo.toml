baseURL = 'https://example.org/'
locale = 'en-US'
title = 'Sidera showcase'
timeZone = 'Asia/Shanghai'
# Tests use the current pinned Sidera submodule.
theme = 'sidera'
disableKinds = ['RSS']
# Import Sidera's taxonomy definitions, without redefining them here.
[taxonomies]
_merge = 'shallow'

# Explicit metadata-only fallback chains: no Git, file mtime or build clock.
[frontmatter]
date = ['date', 'publishDate', 'pubdate', 'published']
publishDate = ['publishDate', 'pubdate', 'published', 'date']
lastmod = ['lastmod', 'modified', 'publishDate', 'pubdate', 'published', 'date']

[pagination]
path = 'page'
disableAliases = true

# Journal date is its publication date; preserve explicit slugs or bundle basenames.
[permalinks.page]
journal = '/journal/:year/:month/:day/:slugorcontentbasename/'

# Import only the theme's term URL defaults; site rules still take precedence.
[permalinks.term]
_merge = 'shallow'
[markup.tableOfContents]
_merge = 'shallow'

# Native parser defaults required by the current optional manual's examples.
[markup.goldmark.parser]
_merge = 'deep'
[markup.goldmark.parser.attribute]
_merge = 'shallow'
[markup.goldmark.extensions.passthrough]
_merge = 'deep'
